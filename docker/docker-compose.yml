
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    restart: unless-stopped
    working_dir: /var/www/html

    env_file:
      - ../.env

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy

    environment:
      APP_NAME: "FixPoint Service"
      APP_ENV: production
      APP_DEBUG: "false"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: fixpoint_service
      DB_USERNAME: root
      DB_PASSWORD: root

    volumes:
      - ../storage/app/public:/var/www/html/storage/app/public

    command: >
      sh -c "php artisan storage:link &&
             php artisan serve --host=0.0.0.0 --port=2289"

  db:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: fixpoint_service
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
