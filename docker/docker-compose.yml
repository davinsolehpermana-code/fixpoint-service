
services:
  # Aplikasi Laravel FixPoint Service
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fixpoint-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "FixPoint Service"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: fixpoint_service
      DB_USERNAME: root
      DB_PASSWORD: root

    volumes:
      - ../storage/app/public:/var/www/html/storage/app/public
    command: >
      sh -c "php artisan storage:link &&
             php artisan serve --host=0.0.0.0 --port=8000"

  # Database MySQL
  db:
    image: mysql:8.0
    container_name: fixpoint-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fixpoint_service
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

# Penyimpanan permanen database
volumes:
  mysql_data:
